spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/Vito}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

security:
  encryption-key: ${ENCRYPTION_KEY}

  hash-algorithm: ${HASH_ALGORITHM:SHA-512}

  password-expiry-days: ${PASSWORD_EXPIRY_DAYS:90}

  mfa-issuer: ${MFA_ISSUER:Vito Clinic}

server:
  port: 8081

server.error.include-stacktrace: never
server.error.include-message: never
