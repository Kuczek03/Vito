services:
  postgres-db:
    image: postgres:16-alpine
    container_name: clinic-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: haslohaslo
      POSTGRES_DB: Vito
    ports:
      - "5433:5432"
    volumes:
      - clinic_pg_data:/var/lib/postgresql/data

volumes:
  clinic_pg_data: